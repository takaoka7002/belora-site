<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" role="img" aria-label="モバイルバッテリーをUSB-Cケーブルでコントロールユニットにつなぐと、ライトヘッドが点灯します">
  <defs>
    <linearGradient id="beamv" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#ffe9a8" stop-opacity=".95"/>
      <stop offset="1" stop-color="#ffe9a8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rulev" x1="0" x2="1">
      <stop offset="0" stop-color="#cc2f4a"/><stop offset=".52" stop-color="#7a3f9e"/><stop offset="1" stop-color="#3a49b8"/>
    </linearGradient>
  </defs>
  <style>
    .lb{font:700 23px "Yu Gothic","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;fill:#16162a;}
    .sb{font:400 20px "Yu Gothic","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;fill:#5a5a72;}
    .tg{font:700 18px "Yu Gothic","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;fill:#7a3f9e;letter-spacing:.06em;}
  </style>

  <!-- モバイルバッテリー -->
  <g transform="translate(-15 0)"><rect x="40" y="16" width="110" height="100" rx="14" fill="#f6f6fa" stroke="#16162a" stroke-width="3"/></g>
  <g transform="translate(-15 0)"><path d="M100 34 L80 70 H94 L89 98 L112 60 H97 Z" fill="#7a3f9e"/></g>
  <g transform="translate(-15 0)"><rect x="86" y="112" width="18" height="10" rx="2" fill="#16162a"/></g>
  <text x="160" y="62" class="lb">モバイルバッテリー</text>
  <text x="160" y="92" class="sb">USB PD対応</text>

  <!-- USB-C ケーブル -->
  <g transform="translate(-15 0)"><path d="M95 122 V186" stroke="#16162a" stroke-width="5" fill="none" stroke-linecap="round"/></g>
  <g transform="translate(-15 0)"><path d="M86 150 l9 10 l9 -10" stroke="url(#rulev)" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>
  <text x="101" y="160" class="tg">USB-C</text>

  <!-- コントロールユニット -->
  <g transform="translate(-15 0)"><rect x="45" y="186" width="100" height="96" rx="12" fill="#16162a"/></g>
  <g transform="translate(-15 0)"><circle cx="95" cy="234" r="19" fill="#ffffff"/></g>
  <g transform="translate(-15 0)"><circle cx="95" cy="234" r="12" fill="none" stroke="#c2bfff" stroke-width="2"/></g>
  <text x="160" y="228" class="lb">コントロールユニット</text>
  <text x="160" y="258" class="sb">操作ボタンで点灯</text>

  <!-- コード -->
  <g transform="translate(-15 0)"><path d="M95 282 C95 310 130 312 130 330 S95 348 95 360" stroke="#16162a" stroke-width="4" fill="none" stroke-linecap="round"/></g>

  <!-- ライトヘッド＋光 -->
  <g transform="translate(-15 0)"><rect x="77" y="360" width="36" height="66" rx="7" fill="#16162a"/></g>
  <g transform="translate(-15 0)"><rect x="81" y="420" width="28" height="8" rx="2" fill="#fff6d6"/></g>
  <g transform="translate(-15 0)"><polygon points="81,428 109,428 150,478 40,478" fill="url(#beamv)"/></g>
  <text x="160" y="392" class="lb">ライトヘッド</text>
  <text x="160" y="422" class="sb">ルーペに装着</text>
</svg>
