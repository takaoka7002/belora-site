<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 225" role="img" aria-label="モバイルバッテリーをUSB-Cケーブルでコントロールユニットにつなぐと、ライトヘッドが点灯します">
  <defs>
    <linearGradient id="beam" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#ffe9a8" stop-opacity=".95"/>
      <stop offset="1" stop-color="#ffe9a8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" x2="1">
      <stop offset="0" stop-color="#cc2f4a"/><stop offset=".52" stop-color="#7a3f9e"/><stop offset="1" stop-color="#3a49b8"/>
    </linearGradient>
  </defs>
  <style>
    .lb{font:700 24px "Yu Gothic","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;fill:#16162a;}
    .sb{font:400 19px "Yu Gothic","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;fill:#5a5a72;}
    .tg{font:700 17px "Yu Gothic","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;fill:#7a3f9e;letter-spacing:.06em;}
  </style>

  <g transform="translate(28 0)">
  <!-- モバイルバッテリー -->
  <rect x="30" y="20" width="130" height="118" rx="14" fill="#f6f6fa" stroke="#16162a" stroke-width="3"/>
  <path d="M100 44 L78 84 H94 L88 116 L114 72 H97 Z" fill="#7a3f9e"/>
  <rect x="156" y="70" width="10" height="18" rx="2" fill="#16162a"/>

  <!-- USB-C ケーブル -->
  <path d="M166 79 H320" stroke="#16162a" stroke-width="5" fill="none" stroke-linecap="round"/>
  <text x="243" y="62" text-anchor="middle" class="tg">USB-C</text>
  <path d="M268 70 l10 9 l-10 9" stroke="url(#rule)" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- コントロールユニット -->
  <rect x="320" y="24" width="112" height="110" rx="12" fill="#16162a"/>
  <circle cx="376" cy="79" r="20" fill="#ffffff"/>
  <circle cx="376" cy="79" r="13" fill="none" stroke="#c2bfff" stroke-width="2"/>

  <!-- コード -->
  <path d="M432 79 C495 79 505 42 555 42 S615 79 640 79" stroke="#16162a" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- ライトヘッド＋光 -->
  <polygon points="720,68 836,20 836,138 720,90" fill="url(#beam)"/>
  <rect x="640" y="60" width="80" height="38" rx="7" fill="#16162a"/>
  <rect x="714" y="64" width="8" height="30" rx="2" fill="#fff6d6"/>

  <!-- ラベル -->
  <text x="95" y="176" text-anchor="middle" class="lb">モバイルバッテリー</text>
  <text x="95" y="204" text-anchor="middle" class="sb">USB PD対応</text>
  <text x="376" y="176" text-anchor="middle" class="lb">コントロールユニット</text>
  <text x="376" y="204" text-anchor="middle" class="sb">操作ボタンで点灯</text>
  <text x="680" y="176" text-anchor="middle" class="lb">ライトヘッド</text>
  <text x="680" y="204" text-anchor="middle" class="sb">ルーペに装着</text>
  </g>
</svg>
